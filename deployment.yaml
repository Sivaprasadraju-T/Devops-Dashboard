apiVersion: apps/v1
kind: Deployment

metadata:
  name: devops-dashboard
  namespace: devops-dashboard

spec:
  replicas: 3

  selector:
    matchLabels:
      app: devops-dashboard

  template:
    metadata:
      labels:
        app: devops-dashboard

    spec:
      containers:
        - name: devops-dashboard
          image: devops-dashboard:1.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5000

          env:
            - name: ENVIRONMENT
              value: "kubernetes"